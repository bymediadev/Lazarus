# Lazarus — Render Blueprint (monolith: Vite UI + Express API)
# Manual deploy: New Web Service → build `npm install && npm run build`, start `npm start`, health `/api/health`
services:
  - type: web
    name: lazarus
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: DATA_RETENTION_DAYS
        value: "30"
      # Render injects PORT — do not set it. UI is same-origin /api (monolith).
      - key: GEMINI_API_KEY
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: ASSEMBLYAI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: PURGE_CRON_SECRET
        sync: false
      - key: LAZARUS_API_KEY
        sync: false
      - key: VITE_LAZARUS_API_KEY
        sync: false
      - key: ZOOM_CLIENT_ID
        sync: false
      - key: ZOOM_CLIENT_SECRET
        sync: false
      - key: ZM_RTMS_CLIENT
        sync: false
      - key: ZM_RTMS_SECRET
        sync: false
      - key: ZOOM_WEBHOOK_SECRET_TOKEN
        sync: false
      - key: ZOOM_REDIRECT_URI
        sync: false
      - key: PUBLIC_API_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: TEAMS_CLIENT_ID
        sync: false
      - key: TEAMS_CLIENT_SECRET
        sync: false
      - key: TEAMS_TENANT_ID
        sync: false
      - key: TEAMS_REDIRECT_URI
        sync: false
      - key: HUBSPOT_CLIENT_ID
        sync: false
      - key: HUBSPOT_CLIENT_SECRET
        sync: false
      - key: HUBSPOT_REDIRECT_URI
        sync: false
      - key: HUBSPOT_WEBHOOK_SECRET
        sync: false
      - key: SALESFORCE_CLIENT_ID
        sync: false
      - key: SALESFORCE_CLIENT_SECRET
        sync: false
      - key: SALESFORCE_REDIRECT_URI
        sync: false
      - key: SALESFORCE_LOGIN_URL
        sync: false
      - key: SALESFORCE_WEBHOOK_SECRET
        sync: false
      - key: OAUTH_STATE_SECRET
