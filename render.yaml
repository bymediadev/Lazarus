# Lazarus — Render Blueprint (API). Public site is GitHub Pages at www.getldr.ca.
# Manual deploy: New Web Service → build `npm install && npm run build`, start `npm start`, health `/api/health`
# After DNS cutover to Pages, remove www.getldr.ca / getldr.ca from `domains` so Render is API-only
# at https://lazarus-4uxi.onrender.com. FRONTEND_ORIGIN should include https://www.getldr.ca first.
#
# Public Buy/Subscribe buttons are Stripe Payment Links (do not wait on this service).
# Free still sleeps after 15 min idle — that delays analyses, OAuth, webhooks, and plan claim.
# Paid starter (or higher) if you want the API itself always on. Do not ping-to-keep-alive.
services:
  - type: web
    name: lazarus
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    domains:
      - www.getldr.ca
      - getldr.ca
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: DATA_RETENTION_DAYS
        value: "30"
      # Render injects PORT — do not set it. Public site is GitHub Pages; this service is API-only.
      - key: GEMINI_API_KEY
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: ASSEMBLYAI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
