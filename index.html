        </p>
        <p>Entry uses Gemini 2.5 Pro. Team uses Gemini 3.1 Pro.</p>
        <p>
          Recoverable or a flat no, the risk score, and the next steps come from fixed rules on our
          server.
        </p>
        <h3>What sales framework breaks the deal down?</h3>
        <p>The Force Interaction Framework. Gemini only maps words that were actually spoken.</p>
        <p>
          Each quote is one force: an enabler that moves the deal, a constraint that stalls it,
          intent, timing, or behavior. The people map names the champion, a hidden detractor, and a
          decision maker who was not on the call.
        </p>
        <p>
          The server scores those forces. That score is recoverable or a flat no, the risk score,
          and the next steps.
        </p>
        <h3>Why not paste the transcript into ChatGPT?</h3>
        <p>
          ChatGPT writes. Paste the same call twice and the answer can change. A general AI generates
          an answer. Lazarus checks quotes against the transcript, then scores with fixed rules you
          can defend in the room.
        </p>
        <h3>Does the AI invent quotes or people?</h3>
        <p>
          If a quote or person is not in your upload, the server strips it before the score runs
          and tells you it did. You score what is left.
        </p>
        <h3>Your data</h3>
        <h3>Do you save the call?</h3>
        <p>
          No. The call is sent here so we can read it. The saved row is the report: the score, the
          status, and the next actions. The transcript and the audio are not saved. A guest run is
          not saved to an account.
        </p>
        <h3>How long do you keep the report?</h3>
        <p>
          While the deal is still open, the report stays. That is the score, the status, and the next
          actions. When HubSpot or Salesforce marks the deal complete, the report is deleted then.
          If the CRM is not connected, the report is deleted 30 days after the deal is marked won,
          or a flat no. A deal that is still stalled, or still recoverable, is not on that clock.
        </p>
        <h3>Who can see our deals?</h3>
        <p>Each company only sees its own reports. Another customer’s workspace cannot read them.</p>
        <h3>What does a company key do?</h3>
        <p>
          A company key lets a server post the deal into this hosted app. The call is sent here, then to
          Google Gemini for scoring. We save the report in the Lazarus database and we do not save the
          transcript. The key is shown once. We store a hash, not the key. It does not put the portal
          on your server, and it does not write to a database you own.
        </p>
        <h3>What is a standalone install?</h3>
        <p>
          The same app on the company’s server, writing to a database they own. The call is handled on
          that server. Scoring sends the transcript to Google Gemini with their key. The report is saved
          in their database, and the transcript is dropped before that write. The Lazarus database does
          not hold those rows. A company key does not create this install. There is no hardware box and
          no signed installer.
        </p>
        <h3>Do you train models on our calls?</h3>
        <p>No. Your content is not used to train public models.</p>
        <h3>Who owns our data?</h3>
        <p>
          You do. You keep ownership of the recording, the transcript, and the notes you upload.
          Lazarus has a limited right to process that content only to write the report. You are the
          controller. We are the processor. The report is yours to use inside the business. That is
          in the <a href="https://www.getldr.ca/terms">Terms of Service</a> and the
          <a href="https://www.getldr.ca/dpa">Data Processing Addendum</a>.
        </p>
        <h3>Where does the data go?</h3>
        <p>
          The call comes to this server. The transcript is sent to Google Gemini to write the brief.
          We do not save the transcript. A free run can use NVIDIA Nemotron through OpenRouter if
          Gemini is unavailable. Hosting is North America by default. If you are signed in, the
          report is stored with Supabase. If you
          upload audio, AssemblyAI transcribes it, and we do not save the audio. Stripe sees billing
          only if you pay. Gmail, Outlook, Zoom, Teams, HubSpot, and Salesforce run only when you
          connect them. The full list is in the
          <a href="https://www.getldr.ca/dpa">Data Processing Addendum</a>.
        </p>
        <h3>Can your team read our deals?</h3>
        <p>
          The transcript is not kept, so there is no call library to open later. Other companies
          cannot see your reports. The service that writes the report runs on our server. An
          allowlisted ops login can reach operational tools. We do not use your deals to train
          models, and we do not sell them.
        </p>
        <h3>How do we delete our data?</h3>
        <p>
          Delete the account from Account, or email support@getldr.ca. A written request is handled
          within 30 days where we can technically delete it. When a contract ends, customer personal
          data is deleted from production within 30 days. The transcript was not saved. The report
          also deletes on its own 30 days after a win or a flat no.
        </p>
        <h3>Who is responsible for recording consent?</h3>
        <p>
          You are. Upload only calls and emails you already have the right to use. We do not join
          the meeting, and we do not check consent for you.
        </p>
        <h3>Not offered today</h3>
        <h3>Do you have SSO or a HIPAA agreement?</h3>
        <p>
          No SSO and no HIPAA business associate agreement on this hosted app. Hosting here is North
          America by default. A different region is only by written agreement. A standalone install is
          separate: the company runs this same app on their server and their database. The company key
          does not create it.
        </p>
        <h3>Do you offer an uptime guarantee?</h3>
        <p>
          No. The service is provided as available. We do not offer an uptime SLA today. That is in
          the <a href="https://www.getldr.ca/terms">Terms of Service</a>.
        </p>
        <h3>Are you SOC 2 certified?</h3>
        <p>
          No. Not today. That is an honest fit for a pilot and for mid-market. Before a larger
          contract, read the
          <a href="https://www.getldr.ca/security-overview">Security Overview</a>, the
          <a href="https://www.getldr.ca/privacy">Privacy Policy</a>, and the
          <a href="https://www.getldr.ca/dpa">Data Processing Addendum</a>.
        </p>
        <h3>Price</h3>
        <h3>Do we pay per person?</h3>
        <p>
          No. You pay per deal analysis. Five a month are free, then $10 a report. Entry is $99 a
          month for 20. Team is $499 a month for unlimited. Not per seat.
        </p>
        <h3>Can we try one deal before we buy?</h3>
        <p>
          Yes. Five analyses a month are free. No credit card. Paste one transcript. Sign in only if
          you want the report saved.
        </p>
        <h2>Pricing</h2>
        <p>
          Five free analyses a month. Then $10 a report, or a monthly plan. You pay per deal
          analysis, not per seat. Free needs no card. After a monthly cap, buy a $10 extra report
          or wait until the plan renews.
        </p>
        <h2>About Lazarus Deal Recovery</h2>
        <p>
          Purpose-built for one job: recovering stalled deals. Sales leaders use it across the team.
          A rep can run the deal they are personally trying to save. You already have a recorder
          and HubSpot. What you do not have is a clear call on which deals are still winnable. A
          person still runs the deal. Lazarus does not sell, write outreach, or replace your team.
          The report stays on your account. The call is not used to train public models.
        </p>
        <p>Founded by Joshua Bennett.</p>
