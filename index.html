      <main>
        <p>Purpose-built stalled-deal recovery</p>
        <h1>Find out which stalled deals are worth saving — and exactly what to do next.</h1>
        <p>
          Your CRM already shows which deals have stalled. Lazarus reads the evidence and scores it
          with fixed rules, so the same deal does not get a different answer the next time you ask.
        </p>
        <ul>
          <li>Find deals worth saving</li>
          <li>Understand why they're stuck</li>
          <li>Identify the real blocker</li>
          <li>Get a deal-specific recovery plan</li>
          <li>Focus sales time where it can have the most impact</li>
        </ul>
        <p>
          <a href="https://www.getldr.ca/portal">Scan 5 Stalled Deals Free</a>
          ·
          <a href="https://calendly.com/getldr-sales/30min">Book a 30-minute look</a>
        </p>
        <p>Five free analyses. No credit card. See whether a real deal belongs in this number.</p>
        <h2>How it works</h2>
        <ol>
          <li>
            Add the evidence: a recording, transcript, email thread, or CRM notes, in one run.
          </li>
          <li>
            Run the analysis: Lazarus names the blocker in plain language, and whether the deal is
            recoverable or a flat no.
          </li>
          <li>
            The deal updates: connect HubSpot or Salesforce. Notes come in; the next action and the
            plan write back to the record.
          </li>
        </ol>
        <h2>What the report gives you</h2>
        <p>
          Lazarus does not give every stalled deal the same 90-day playbook. It gives you the next
          action, the next checkpoint, and a longer path only when the evidence needs one. If the
          deal is a flat no, the plan is to stop.
        </p>
        <h3>Forecast snapshot</h3>
        <p>
          Five scores sit at the top: Deal Risk Score, dept friction, dispersion, stall signals,
          and recoverability. Use them when someone asks why the number moved.
        </p>
        <h3>Fast Facts</h3>
        <p>
          The default view has three cards: what this deal is (recoverable versus a flat no, plus
          the blocker), the main detractors with the quote from your evidence, and how to save it.
        </p>
        <h3>The recovery plan</h3>
        <p>
          This week (0-7 days) is the next action. Inside 30 days is the checkpoint. 30-90 days is
          only if procurement, legal, or security still has to move — the maximum horizon, not a
          wait. A flat no says stop, and do not spend another quarter on it. Copy for CRM, or push
          to HubSpot or Salesforce.
        </p>
        <h2>Who it is for</h2>
        <p>Purpose-built for one job: recovering stalled deals.</p>
        <p>
          For sales leaders: recover stalled pipeline across your team. See which deals will close,
          which are recoverable, and which are a flat no before the forecast call.
        </p>
        <p>
          For sales reps and agents: get a second set of eyes on the deal you're personally trying
          to save. A person still runs the deal.
        </p>
        <p>
          You could prompt a general AI to analyze a stalled deal. Lazarus is purpose-built to make
          stalled-deal recovery a repeatable process.
        </p>
        <h2>Straight answers</h2>
        <h3>Do you join the call?</h3>
        <p>
          No. Lazarus never joins Meet, Teams, or Zoom. You drop the recording, transcript, or
          email after. Keep the tools you already use.
        </p>
        <h3>Why not paste the transcript into ChatGPT?</h3>
        <p>
          ChatGPT writes. Paste the same call twice and the answer can change. A general AI generates
          an answer. Lazarus checks quotes against the transcript, then scores with fixed rules you
          can defend in the room.
        </p>
        <h3>Does the AI invent quotes or people?</h3>
        <p>
          If a quote or person is not in your upload, the server strips it before the score runs
          and tells you it did. You score what is left.
        </p>
        <h3>Is our data safe? Do you have SOC 2?</h3>
        <p>
          Encrypted in transit and at rest. Your content is not used to train public models. Teams
          only see their own deals. Saved transcripts purge on a 30-day default. We are not SOC 2
          certified today. Honest fit for a pilot and mid-market. Full detail is in the
          <a href="https://www.getldr.ca/security-overview">Security Overview</a>.
        </p>
        <h3>Do you read our whole inbox?</h3>
        <p>
          No. Mailbox connect is read-only. You search a deal and attach that thread. No silent
          scrape.
        </p>
        <h2>Pricing</h2>
        <p>
          Five free analyses a month. Then $10 a report, or a monthly plan. You pay per deal
          analysis, not per seat. Free needs no card. After a monthly cap, buy a $10 extra report
          or wait until the plan renews.
        </p>
        <h2>About Lazarus Deal Recovery</h2>
        <p>
          Purpose-built for one job: recovering stalled deals. Sales leaders use it across the team.
          A rep can run the deal they are personally trying to save. You already have a recorder
          and HubSpot. What you do not have is a clear call on which deals are still winnable. A
          person still runs the deal. Lazarus does not sell, write outreach, or replace your team.
          Your data stays on your account and is not used to train public models.
          <a href="https://www.getldr.ca/security-overview">Security Overview</a>.
        </p>
        <p>
          Founded by Joshua Bennett.
          <a href="https://www.linkedin.com/company/lazarus-deal-recovery">Lazarus Deal Recovery on LinkedIn</a>.
        </p>
