name: Founder critical alerts

# Break-through CRITICAL checks between digests (every 10 minutes).

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  critical:
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate critical founder alerts
        run: |
          set -euo pipefail
          url="${{ secrets.LAZARUS_API_URL }}/api/founder/alerts/run"
          body="/tmp/founder-alert-body.txt"
          for i in 1 2 3 4 5; do
            code=$(curl -sS --max-time 45 -o "$body" -w "%{http_code}" -X POST "$url" \
              -H "x-cron-secret: ${{ secrets.PURGE_CRON_SECRET }}" || true)
            if [ "$code" = "200" ]; then
              cat "$body"
              exit 0
            fi
            echo "Attempt $i: HTTP ${code:-000}"
            cat "$body" 2>/dev/null || true
            sleep $((i * 8))
          done
          echo "Founder alerts/run failed after retries"
          exit 1
