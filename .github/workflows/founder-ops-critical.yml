name: Founder critical alerts

# Break-through CRITICAL checks between digests (every 10 minutes).

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  critical:
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate critical founder alerts
        run: |
          curl -sf -X POST "${{ secrets.LAZARUS_API_URL }}/api/founder/alerts/run" \
            -H "x-cron-secret: ${{ secrets.PURGE_CRON_SECRET }}"
