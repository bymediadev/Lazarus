name: Founder ops digests

# Morning / afternoon / evening status emails (America/New_York defaults).
# Cron times are UTC equivalents of 8:00, 13:00, 20:00 ET (EST = UTC-5).
# During EDT (UTC-4) these fire one hour early — acceptable for v1; adjust if needed.

on:
  schedule:
    - cron: "0 13 * * *" # ~8:00 ET
    - cron: "0 18 * * *" # ~13:00 ET
    - cron: "0 1 * * *" # ~20:00 ET
  workflow_dispatch:
    inputs:
      slot:
        description: "Optional slot override (morning|afternoon|evening)"
        required: false
        default: ""

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Send founder status digest
        env:
          SLOT: ${{ github.event.inputs.slot }}
        run: |
          set -euo pipefail
          BODY="{}"
          if [ -n "${SLOT:-}" ]; then
            BODY=$(printf '{"slot":"%s"}' "$SLOT")
          fi
          url="${{ secrets.LAZARUS_API_URL }}/api/founder/alerts/digest"
          out="/tmp/founder-digest-body.txt"
          for i in 1 2 3 4 5; do
            code=$(curl -sS --max-time 45 -o "$out" -w "%{http_code}" -X POST "$url" \
              -H "x-cron-secret: ${{ secrets.PURGE_CRON_SECRET }}" \
              -H "Content-Type: application/json" \
              -d "$BODY" || true)
            if [ "$code" = "200" ]; then
              cat "$out"
              exit 0
            fi
            echo "Attempt $i: HTTP ${code:-000}"
            cat "$out" 2>/dev/null || true
            sleep $((i * 8))
          done
          echo "Founder alerts/digest failed after retries"
          exit 1
